<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Asistente Virtual Llutid+</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos generales */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #c9d1d9;
        }
        .chat-container {
            width: 450px;
            height: 650px;
            background-color: #161b22;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #30363d;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Encabezado del Chat */
        .chat-header {
            background-color: #2188ff;
            color: white;
            padding: 20px 25px;
            text-align: center;
            font-size: 1.6em;
            font-weight: 700;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }
        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .profile-info h3 {
            margin: 0;
            font-size: 1.1em;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }
        .profile-info p {
            margin: 0;
            font-size: 0.8em;
            font-weight: 400;
            color: #d1e3ff;
        }


        /* Caja de Mensajes */
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #24292e;
            border-bottom: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* Estilo de la barra de desplazamiento (para navegadores WebKit como Chrome/Safari) */
        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #24292e;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 10px;
            border: 2px solid #24292e;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background-color: #777;
        }

        .message {
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.98em;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            animation: messagePop 0.3s ease-out;
        }

        @keyframes messagePop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .message.user {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 8px;
        }
        .message.bot {
            background-color: #3a3a3a;
            color: #e0e0e0;
            align-self: flex-start;
            margin-right: auto;
            border: 1px solid #4a4a4a;
            border-bottom-left-radius: 8px;
        }
        .message.system {
            font-style: italic;
            color: #888;
            text-align: center;
            align-self: center;
            background: none;
            box-shadow: none;
            padding: 8px 0;
            margin: 0;
            font-size: 0.88em;
            animation: fadeIn 0.4s ease-out;
        }
        .message.code-display {
            background-color: #2d3640;
            color: #a4ddff;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-weight: 600;
            text-align: center;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            border: 1px dashed #6a737d;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .message ul {
            list-style: none;
            padding-left: 0;
            margin: 5px 0;
        }
        .message ul li {
            margin-bottom: 7px;
            line-height: 1.6;
        }
        .message ul li strong {
            color: #58a6ff;
        }
        .message a {
            color: #87CEEB;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }
        .message a:hover {
            color: #58a6ff;
            text-decoration: underline;
        }

        /* Botón de WhatsApp más llamativo */
        .whatsapp-button {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05em;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .whatsapp-button:hover {
            background-color: #1da851;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .whatsapp-button:active {
            transform: translateY(0);
        }

        .whatsapp-button::before {
            content: '📞';
            font-size: 1.2em;
        }


        /* Contenedor de Entrada */
        .input-container {
            display: flex;
            padding: 15px 20px;
            border-top: 1px solid #30363d;
            background-color: #161b22;
            gap: 10px;
        }
        .input-container input {
            flex-grow: 1;
            padding: 14px 20px;
            border: 1px solid #555;
            border-radius: 30px;
            font-size: 1.05em;
            background-color: #333;
            color: white;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-container input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.4);
            background-color: #2b2b2b;
        }
        .input-container button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.05em;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }
        .input-container button:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .input-container button:active {
            transform: translateY(0);
        }

        /* --- MEDIA QUERIES PARA ADAPTACIÓN MÓVIL --- */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                min-height: auto;
                padding: 0;
            }

            .chat-container {
                width: 100%;
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
                box-shadow: none;
                border: none;
            }

            .chat-header {
                font-size: 1.4em;
                padding: 18px 20px;
                border-top-left-radius: 0;
                border-top-right-radius: 0;
            }

            .chat-box {
                padding: 15px;
                gap: 10px;
            }

            .message {
                padding: 10px 15px;
                font-size: 0.95em;
                max-width: 90%;
            }

            .input-container {
                padding: 10px 15px;
                gap: 8px;
            }

            .input-container input {
                padding: 12px 18px;
                font-size: 1em;
            }

            .input-container button {
                padding: 12px 20px;
                font-size: 1em;
            }

            .whatsapp-button {
                padding: 10px 20px;
                font-size: 0.95em;
                margin-top: 10px;
            }
        }

        /* Ajustes adicionales para pantallas muy pequeñas (ej. iPhone 5/SE) */
        @media (max-width: 360px) {
            .chat-header {
                font-size: 1.3em;
                padding: 15px;
            }
            .chat-box {
                padding: 10px;
            }
            .message {
                font-size: 0.9em;
                padding: 8px 12px;
            }
            .input-container input,
            .input-container button {
                font-size: 0.9em;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <img src="https://i.postimg.cc/jq4kVY08/Whats-App-Image-2025-08-02-at-10-16-08-AM.jpg" class="profile-pic">
            <div class="profile-info">
                <h3>Soporte Oficial Llutid+</h3>
                <p>En línea • Asistente Virtual</p>
            </div>
        </div>
        <div class="chat-box" id="chat-box">
        </div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Escribe tu mensaje...">
            <button id="send-button">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // ** Datos de ejemplo para usuarios (en un caso real, vendrían de una DB) **
        const usersDB = [
            { fullName: 'JUAN PEREZ GOMEZ', phoneNumber: '3101234567' },
            { fullName: 'FELIPE HIDALGO', phoneNumber: '3170241150' },
            { fullName: 'LLUTID', phoneNumber: '3181087834' },
            { fullName: 'ANDRES REYES', phoneNumber: '3244779032' },
            { fullName: 'JHONATAN PEREZ', phoneNumber: '3154103024' },
            { fullName: 'RICARDO GIRALDO', phoneNumber: '3508591280' },
            { fullName: 'MATEO BUSTOS', phoneNumber: '3243724956' },
            { fullName: 'YEFERSON STIVEN', phoneNumber: '3106307450' },
            { fullName: 'CARLOS RODRIGUEZ SANCHEZ', phoneNumber: '3125551234' }
        ];

        let conversationState = 'initial_welcome'; // Nuevo estado inicial para mostrar el mensaje de bienvenida
        let currentUser = null; // Guardar el usuario que se está verificando
        let currentRequestType = ''; // 'password_change', 'email_change', 'login_issue', 'new_account_request', 'support_feedback'
        let generatedCode = ''; // Almacena el código de verificación generado

        // Para el flujo de registro de Llutid+
        let newAccountData = {
            fullName: '',
            email: '',
            phoneNumber: ''
        };

        // Para el flujo de soporte y quejas
        let userFeedback = '';

        // --- Configuración de Información de Contacto de Llutid ---
        const LLUTID_WHATSAPP_PHONE = '+573181087834'; // Número de WhatsApp para contacto con asesor
        const LLUTID_SUPPORT_PHONE = '+573181087834'; // Línea telefónica de Llutid
        const LLUTID_SUPPORT_EMAIL = 'llutidoficial@gmail.com'; // Correo electrónico oficial de Llutid
        // --- URLs de ejemplo (reemplaza con las URLs reales de tu sitio web) ---
        const LLUTID_REGISTER_URL = 'https://www.llutid.com/registro';
        const LLUTID_ABOUT_URL = 'https://www.llutid.com/quienes-somos';
        const LLUTID_PLANS_URL = 'https://llutid.github.io/llutid-/';
        const LLUTID_HELP_URL = 'https://www.llutid.com/ayuda';
        // --- URL del formulario de reporte de errores ---
        const LLUTID_BUG_REPORT_FORM = 'https://forms.gle/FwNG8E6yTBNB4MCf9';

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Función para añadir mensajes al chat
        function appendMessage(text, sender, className = '') {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            if (className) {
                messageDiv.classList.add(className);
            }
            // Usa innerHTML si el texto contiene etiquetas HTML (como listas, negritas, enlaces)
            if (sender === 'bot' && (text.includes('<ul>') || text.includes('<a href=') || text.includes('<p>') || text.includes('<strong>') || text.includes('<div>'))) {
                messageDiv.innerHTML = text;
            } else {
                messageDiv.textContent = text;
            }
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll al final
        }

        // Función para mostrar el indicador de "escribiendo..."
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('message', 'system');
            typingDiv.id = 'typing-indicator';
            typingDiv.textContent = 'El asistente está escribiendo...';
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll
        }

        // Función para remover el indicador de "escribiendo..."
        function removeTypingIndicator() {
            const typingDiv = document.getElementById('typing-indicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        // Genera un código aleatorio con el formato LNNNNN53
        function generateRandomCode() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const randomChar = characters.charAt(Math.floor(Math.random() * characters.length));
            let randomDigits = '';
            for (let i = 0; i < 5; i++) { // 5 dígitos aleatorios
                randomDigits += Math.floor(Math.random() * 10);
            }
            return `${randomChar}${randomDigits}53`;
        }

        // Obtiene el saludo según la hora del día
        function getGreeting() {
            const hour = new Date().getHours();
            if (hour < 12) {
                return 'Buenos días';
            } else if (hour < 19) {
                return 'Buenas tardes';
            } else {
                return 'Buenas noches';
            }
        }

        // Muestra el mensaje de bienvenida inicial
        async function displayInitialWelcomeMessage() {
            const greeting = getGreeting();
            appendMessage(`¡${greeting}! 👋 Soy Cebrid, tu asistente virtual de Llutid+.`, 'bot');
            await new Promise(resolve => setTimeout(resolve, 1000));
            appendMessage('Estoy aquí para ayudarte con cualquier consulta o problema que tengas.', 'bot');
            await new Promise(resolve => setTimeout(resolve, 1000));
            await showMenu();
        }

        // Muestra el menú de opciones (principal)
        async function showMenu(fromReturn = false) { // fromReturn para controlar el mensaje inicial
            if (!fromReturn) { // Solo muestra este mensaje si no viene de una opción de "volver"
                appendMessage('¡Excelente! ¿En qué puedo ayudarte hoy? ✨', 'bot');
                await new Promise(resolve => setTimeout(resolve, 800));
            }

            const menuHtml = `
                <p>Por favor, selecciona una de las siguientes opciones ingresando el **número** correspondiente:</p>
                <ul>
                    <li><strong>1.</strong> Problemas con mi cuenta o al iniciar sesión.</li>
                    <li><strong>2.</strong> Quiero ser parte de la familia Llutid+ / Obtener una cuenta.</li>
                    <li><strong>3.</strong> ¿Qué es Llutid+?</li>
                    <li><strong>4.</strong> Preguntas frecuentes.</li>
                    <li><strong>5.</strong> Soporte de problemas, quejas o sugerencias.</li>
                    <li><strong>6.</strong> Hablar con un asesor.</li>
                    <li><strong>7.</strong> Cancelación de cuenta.</li>
                    <li><strong>8.</strong> Reportar un error técnico de la plataforma.</li>
                </ul>
                <p>Si en algún momento quieres volver a este menú, simplemente escribe **"Menú"** o el **número 0**.</p>
            `;
            appendMessage(menuHtml, 'bot');
            conversationState = 'initial_menu'; // Establece el estado para esperar la selección del menú
        }

        // Función principal para manejar los mensajes del usuario
        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            appendMessage(message, 'user');
            userInput.value = '';
            showTypingIndicator(); // Mostrar indicador de "escribiendo"

            await new Promise(resolve => setTimeout(resolve, 800)); // Simular tiempo de procesamiento

            let botResponse = '';
            const normalizedMessage = message.toLowerCase();

            // *** MEJORA: Manejo de saludos y despedidas ***
            if (['adiós', 'chao', 'hasta luego', 'bye'].some(word => normalizedMessage.includes(word))) {
                removeTypingIndicator();
                appendMessage('¡Adiós! Que tengas un excelente día. Si necesitas algo más, no dudes en volver a contactarnos. 👋', 'bot');
                conversationState = 'initial_welcome'; // Reinicia el estado para un nuevo saludo
                return;
            }

            // *** MEJORA: Manejo de agradecimientos ***
            if (['gracias', 'muchas gracias', 'mil gracias'].some(word => normalizedMessage.includes(word))) {
                removeTypingIndicator();
                appendMessage('De nada, ¡es un placer ayudarte! Si necesitas algo más, no dudes en volver a contactarnos. 😊', 'bot');
                return;
            }

            // Manejo global de "Menú" o "0" (para volver al menú principal)
            if (normalizedMessage === 'menu' || normalizedMessage === '0') {
                removeTypingIndicator();
                await showMenu(true); // Pasar true para evitar el mensaje de "Excelente..." repetitivo
                return;
            }


            // Lógica principal del chatbot
            switch (conversationState) {
                case 'initial_welcome':
                    if (normalizedMessage.includes('hola') || normalizedMessage.includes('buenos dias') || normalizedMessage.includes('buenas tardes') || normalizedMessage.includes('buenas noches') || normalizedMessage.includes('que tal')) {
                        removeTypingIndicator();
                        await showMenu();
                        return;
                    } else {
                        botResponse = 'Para iniciar nuestra conversación, por favor, escribe **"Hola"** o un saludo. ¡Estoy aquí para asistirte con gusto! 😊';
                    }
                    break;
                case 'initial_menu':
                    // Si ya se manejó por palabras clave, no hacer nada aquí
                    if (!botResponse) {
                        botResponse = await handleInitialMenuSelection(message);
                    }
                    break;
                case 'sub_menu_1': // Problemas con la cuenta o login
                    botResponse = await handleSubMenu1Selection(message);
                    break;
                case 'awaiting_full_name':
                    botResponse = await handleFullName(message);
                    break;
                case 'awaiting_phone_number':
                    botResponse = await handlePhoneNumber(message);
                    break;
                case 'awaiting_security_code':
                    botResponse = await handleSecurityCode(message);
                    break;
                case 'new_account_name':
                    botResponse = await handleNewAccountName(message);
                    break;
                case 'new_account_email':
                    botResponse = await handleNewAccountEmail(message);
                    break;
                case 'new_account_phone':
                    botResponse = await handleNewAccountPhone(message);
                    break;
                case 'faq_section_expanded':
                    botResponse = await handleFAQSectionExpanded(message);
                    break;
                case 'awaiting_user_feedback':
                    botResponse = await handleUserFeedbackInput(message);
                    break;
                case 'confirm_send_feedback':
                    botResponse = await handleConfirmSendFeedback(message);
                    break;
                case 'sub_menu_1_login_issue': // Nuevo estado para manejar las opciones de este sub-menú
                    botResponse = await handleLoginIssueSelection(message);
                    break;
                default:
                    // *** MEJORA: Mensaje de fallback más amigable ***
                    botResponse = 'Lo siento, no pude entender tu solicitud en este momento. Si necesitas ayuda, por favor, selecciona una opción del menú principal escribiendo el número correspondiente, o escribe **"Menú"** o el **"0"** para ver todas las opciones disponibles. 🤔';
                    break;
            }
            removeTypingIndicator();
            if (botResponse) {
                appendMessage(botResponse, 'bot');
            }
        }

        async function handleInitialMenuSelection(userMessage) {
            const normalizedMessage = userMessage.trim();
            let response = '';

            switch (normalizedMessage) {
                case '1':
                    conversationState = 'sub_menu_1';
                    response = `
                        <p>Has seleccionado la opción **"Problemas con mi cuenta o al iniciar sesión"**.</p>
                        <p>Para poder ayudarte de la mejor manera, por favor, elige la opción que mejor describe tu situación ingresando el **número** correspondiente:</p>
                        <ul>
                            <li><strong>1.</strong> Se me olvidó la contraseña / PIN.</li>
                            <li><strong>2.</strong> Quiero cambiar mi correo electrónico.</li>
                            <li><strong>3.</strong> No puedo ingresar a mi cuenta / No funciona el login.</li>
                            <li><strong>4.</strong> Otro problema con mi cuenta.</li>
                        </ul>
                        <p>Recuerda que en cualquier momento puedes escribir **"0"** para volver al menú principal. 🔙</p>
                    `;
                    break;
                case '2':
                    currentRequestType = 'new_account_request';
                    conversationState = 'new_account_name';
                    newAccountData = { fullName: '', email: '', phoneNumber: '' }; // Reiniciar datos
                    response = '¡Excelente decisión! 🎉 Para ayudarte a iniciar tu proceso de registro en Llutid+, por favor, ingresa tu **NOMBRE COMPLETO EN MAYÚSCULAS, SIN PUNTOS, COMAS NI ACENTOS**. Por ejemplo: **JUAN PEREZ GOMEZ**. Puedes escribir **0** para volver al menú anterior si lo necesitas.';
                    break;
                case '3':
                    response = `
                        <p>¡Llutid+ es tu destino definitivo para el entretenimiento digital! 🎬🎮</p>
                        <p>Somos una **plataforma de streaming** que te ofrece una **amplia y emocionante variedad de películas, series y transmisiones en vivo**, desde los últimos estrenos hasta tus clásicos favoritos. Nuestro objetivo es brindarte una experiencia inigualable con **beneficios muy económicos**, ¡contamos con planes desde solo **2.500 COP** para una sola persona, y paquetes familiares muy convenientes!</p>
                        <p>Nos enorgullece ser una plataforma **intuitiva, fácil de usar y altamente profesional**, siempre manteniéndote informado de todas las novedades y actualizaciones. Contamos con un **servicio de soporte dedicado y siempre disponible** para resolver cualquier duda y asegurarnos de que disfrutes de tu contenido sin interrupciones.</p>
                        <p>¡Sumérgete en un mundo de entretenimiento sin límites con Llutid+ y descubre la diversión que te espera! ✨</p>
                        <p>Si deseas explorar más, puedes visitar nuestra sección "<a href="${LLUTID_ABOUT_URL}" target="_blank">Quiénes Somos</a>" en nuestra página web, o escribe **"Menú"** o **"0"** para volver a las opciones principales.</p>
                    `;
                    break;
                case '4':
                    response = `
                        <p>Has seleccionado **"Preguntas Frecuentes"** (FAQ). Aquí tienes algunas de las consultas más comunes que recibimos de nuestros usuarios: 🤔</p>
                        <ul>
                            <li><strong>1.</strong> ¿Qué tipo de contenido puedo encontrar en Llutid+?</li>
                            <li><strong>2.</strong> ¿Cuáles son los planes de suscripción y precios disponibles?</li>
                            <li><strong>3.</strong> ¿Cómo puedo contactar al equipo de soporte técnico de Llutid+?</li>
                            <li><strong>4.</strong> ¿Cuál es el horario de atención al cliente?</li>
                            <li><strong>5.</strong> ¿Llutid+ ofrece pruebas gratuitas o descuentos especiales?</li>
                        </ul>
                        <p>Por favor, escribe el **número de la pregunta** que te interesa para obtener una respuesta detallada, o el **0** para volver al menú principal. ↩️</p>

                            Chatear con Soporte de Llutid+
                        </a>
                    </div>
                    <p>Agradecemos tu paciencia y cooperación. ¡Estamos aquí para escucharte y resolverlo!</p>
                `;
                userFeedback = ''; // Limpiar el feedback
                conversationState = 'initial_menu'; // Volver al menú principal
                appendMessage(response, 'bot');
                return ''; // No retornar nada aquí
            } else if (normalizedConfirmation === 'no') {
                userFeedback = ''; // Limpiar el feedback
                conversationState = 'initial_menu'; // Volver al menú principal
                response = 'Entendido. Tu mensaje no ha sido enviado. ¿Hay algo más en lo que pueda ayudarte? Escribe **"Menú"** o el **"0"** para ver las opciones.';
            } else {
                return 'Lo siento, no entendí tu respuesta. Por favor, responde **"Sí"** para confirmar o **"No"** para cancelar. Puedes escribir **0** para volver al menú principal.';
            }
            return response;
        }

        // --- Función para verificar la disponibilidad del asesor (simulada) ---
        async function getAdvisorAvailabilityMessage() {
            const now = new Date();
            const day = now.getDay(); // 0 = Domingo, 1 = Lunes, ..., 6 = Sábado
            const hour = now.getHours(); // 0-23

            let message = '';
            const whatsappLink = `https://wa.me/${LLUTID_WHATSAPP_PHONE}`;

            // Horario de atención: Lunes a Viernes 9 AM - 6 PM, Sábados 9 AM - 1 PM
            const isWeekday = day >= 1 && day <= 5; // Lunes a Viernes
            const isSaturday = day === 6;
            const isWednesday = day === 3; // Miércoles

            const isDuringWeekdayHours = hour >= 9 && hour < 18; // 9 AM a 5:59 PM
            const isDuringSaturdayHours = hour >= 9 && hour < 13; // 9 AM a 12:59 PM

            if (isWednesday) {
                message = `

                    <p>Puedes contactarnos durante nuestro horario habitual para recibir asistencia en vivo: **Lunes, Martes, Jueves y Viernes** de **9:00 AM a 6:00 PM**, y **Sábados** de **9:00 AM a 1:00 PM**.</p>
                    <p>Si tu consulta es urgente, puedes dejarnos un mensaje por correo electrónico a <a href="mailto:${LLUTID_SUPPORT_EMAIL}">${LLUTID_SUPPORT_EMAIL}</a> o un mensaje por WhatsApp a nuestra línea principal, y te responderemos a la brevedad posible.</p>
                    <p>Gracias por tu comprensión. Si deseas volver al menú principal, escribe **"Menú"** o el **"0"**.</p>
                `;
            } else if ((isWeekday && isDuringWeekdayHours) || (isSaturday && isDuringSaturdayHours)) {
                // Dentro del horario de atención
                message = `
                    <p>¡Excelente! Has seleccionado hablar con un asesor de Llutid+. 🧑‍💼</p>
                    <p>Nuestro equipo está disponible **en este momento** para asistirte de forma personalizada. Ellos podrán ayudarte con cualquier consulta o problema que tengas.</p>
                    <p>Para tu comodidad, te recomendamos chatear con ellos directamente por WhatsApp. Haz clic en el siguiente botón para iniciar la conversación:</p>
                    <div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
                        <a href="${whatsappLink}" target="_blank" class="whatsapp-button">
                            Chatear con un Asesor de Llutid+ Ahora
                        </a>
                    </div>
                    <p>También puedes llamarnos al <a href="tel:${LLUTID_SUPPORT_PHONE}">${LLUTID_SUPPORT_PHONE}</a> o escribirnos a <a href="mailto:${LLUTID_SUPPORT_EMAIL}">${LLUTID_SUPPORT_EMAIL}</a>.</p>
                    <p>Si deseas volver al menú principal, escribe **"Menú"** o el **"0"**.</p>
                `;
            } else {
                // Fuera del horario de atención
                message = `
                    <p>Has seleccionado hablar con un asesor. Actualmente, estamos **fuera de nuestro horario de atención**. 😴</p>
                    <p>Nuestro equipo de soporte está disponible en los siguientes horarios:</p>
                    <ul>
                        <li>**Lunes a Viernes:** De **9:00 AM a 6:00 PM** (Hora de Colombia), **excepto los miércoles**.</li>
                        <li>**Sábados:** De **9:00 AM a 1:00 PM** (Hora de Colombia).</li>
                        <li>**Domingos y Festivos:** Cerrado.</li>
                    </ul>
                    <p>Te invitamos a contactarnos durante nuestro horario de atención para recibir asistencia en vivo. Si tu consulta es urgente o prefieres dejar un mensaje, puedes enviarnos un correo electrónico a <a href="mailto:${LLUTID_SUPPORT_EMAIL}">${LLUTID_SUPPORT_EMAIL}</a> o un mensaje por WhatsApp a nuestra línea principal: <a href="https://wa.me/${LLUTID_WHATSAPP_PHONE}" target="_blank">${LLUTID_WHATSAPP_PHONE}</a>, y te responderemos a la brevedad posible en nuestro próximo horario hábil.</p>
                    <p>Gracias por tu comprensión. Si deseas volver al menú principal, escribe **"Menú"** o el **"0"**.</p>
                `;
            }
            conversationState = 'initial_menu'; // Vuelve al menú principal después de dar la info
            return message;
        }

        // Mostrar el mensaje de bienvenida al cargar la página
        displayInitialWelcomeMessage();
    </script>
