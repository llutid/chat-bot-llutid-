<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Asistente Virtual Llutid+</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos generales */
        body {
            font-family: 'Poppins', sans-serif; /* Fuente más moderna */
            background-color: #0d1117; /* Fondo ultra oscuro, similar a GitHub dark */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Oculta el scrollbar principal del body */
            color: #c9d1d9; /* Color de texto general claro */
        }
        .chat-container {
            width: 450px; /* Ancho fijo para escritorio */
            height: 650px; /* Altura fija para escritorio */
            background-color: #161b22; /* Fondo del chat un poco más claro que el body */
            border-radius: 15px; /* Bordes más suaves */
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7); /* Sombra más pronunciada y oscura */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #30363d; /* Borde sutil y oscuro */
            animation: fadeIn 0.5s ease-out; /* Animación de entrada */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Encabezado del Chat */
        .chat-header {
            background-color: #2188ff; /* Azul vibrante, ligeramente más oscuro para contraste */
            color: white;
            padding: 20px 25px; /* Más padding */
            text-align: center;
            font-size: 1.6em; /* Más grande */
            font-weight: 700; /* Más grueso */
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3); /* Sombra más suave */
            position: relative;
            z-index: 10; /* Asegura que la sombra se vea */
        }

        /* Caja de Mensajes */
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #24292e; /* Fondo de los mensajes más oscuro */
            border-bottom: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 12px; /* Espacio entre mensajes */
            scroll-behavior: smooth; /* Desplazamiento suave */
        }

        /* Estilo de la barra de desplazamiento (para navegadores WebKit como Chrome/Safari) */
        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #24292e; /* Fondo de la barra de desplazamiento */
        }

        .chat-box::-webkit-scrollbar-thumb {
            background-color: #555; /* Color del "pulgar" de la barra de desplazamiento */
            border-radius: 10px;
            border: 2px solid #24292e;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background-color: #777;
        }

        .message {
            padding: 12px 18px; /* Más padding */
            border-radius: 20px; /* Bordes más redondeados */
            max-width: 80%; /* Un poco más estrecho */
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.98em;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            animation: messagePop 0.3s ease-out; /* Animación para cada mensaje */
        }

        @keyframes messagePop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .message.user {
            background-color: #007bff; /* Azul para mensajes de usuario */
            color: white;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 8px; /* Esquina menos redondeada en un lado */
        }
        .message.bot {
            background-color: #3a3a3a; /* Gris oscuro para mensajes del bot */
            color: #e0e0e0; /* Texto claro */
            align-self: flex-start;
            margin-right: auto;
            border: 1px solid #4a4a4a;
            border-bottom-left-radius: 8px; /* Esquina menos redondeada en un lado */
        }
        .message.system { /* Mensajes del sistema, como "escribiendo..." */
            font-style: italic;
            color: #888;
            text-align: center;
            align-self: center;
            background: none;
            box-shadow: none;
            padding: 8px 0;
            margin: 0;
            font-size: 0.88em;
            animation: fadeIn 0.4s ease-out;
        }
        .message.code-display {
            background-color: #2d3640; /* Un color suave para el código */
            color: #a4ddff; /* Color distintivo para el texto del código (azul claro) */
            font-family: 'Fira Code', 'Courier New', Courier, monospace; /* Fuente de código */
            font-weight: 600;
            text-align: center;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            border: 1px dashed #6a737d; /* Borde más visible */
            letter-spacing: 1px; /* Espaciado entre letras */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .message ul {
            list-style: none;
            padding-left: 0;
            margin: 5px 0;
        }
        .message ul li {
            margin-bottom: 7px; /* Más espacio */
            line-height: 1.6;
        }
        .message ul li strong {
            color: #58a6ff; /* Azul más claro para destacar */
        }
        .message a {
            color: #87CEEB; /* Azul claro para enlaces */
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }
        .message a:hover {
            color: #58a6ff; /* Cambia de color al pasar el mouse */
            text-decoration: underline;
        }

        /* Botón de WhatsApp más llamativo */
        .whatsapp-button {
            display: inline-block;
            background-color: #25d366; /* Verde WhatsApp */
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05em;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .whatsapp-button:hover {
            background-color: #1da851; /* Verde más oscuro al pasar el mouse */
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .whatsapp-button:active {
            transform: translateY(0);
        }

        .whatsapp-button::before {
            content: '📞'; /* Icono de teléfono o WhatsApp */
            font-size: 1.2em;
        }


        /* Contenedor de Entrada */
        .input-container {
            display: flex;
            padding: 15px 20px;
            border-top: 1px solid #30363d;
            background-color: #161b22;
            gap: 10px; /* Espacio entre input y botón */
        }
        .input-container input {
            flex-grow: 1;
            padding: 14px 20px; /* Más padding */
            border: 1px solid #555;
            border-radius: 30px; /* Más redondeado */
            font-size: 1.05em; /* Un poco más grande */
            background-color: #333; /* Fondo del input oscuro */
            color: white; /* Texto del input blanco */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-container input:focus {
            outline: none;
            border-color: #007bff; /* Borde azul al enfocar */
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.4); /* Sombra al enfocar */
            background-color: #2b2b2b; /* Ligeramente más claro al enfocar */
        }
        .input-container button {
            background-color: #007bff; /* Azul para el botón */
            color: white;
            border: none;
            padding: 14px 25px; /* Más padding */
            border-radius: 30px; /* Más redondeado */
            cursor: pointer;
            font-size: 1.05em;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }
        .input-container button:hover {
            background-color: #0056b3; /* Azul más oscuro al pasar el mouse */
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .input-container button:active {
            transform: translateY(0);
        }

        /* --- MEDIA QUERIES PARA ADAPTACIÓN MÓVIL --- */
        @media (max-width: 768px) {
            body {
                align-items: flex-start; /* Alinea arriba en móvil */
                min-height: auto; /* Permite que el body se ajuste */
                padding: 0;
            }

            .chat-container {
                width: 100%; /* Ancho completo en móvil */
                height: 100vh; /* Altura completa de la pantalla */
                max-width: 100%; /* Asegura que no se desborde */
                border-radius: 0; /* Sin bordes redondeados en los extremos para ocupar toda la pantalla */
                box-shadow: none; /* Elimina la sombra para un aspecto más nativo */
                border: none; /* Sin borde en móvil */
            }

            .chat-header {
                font-size: 1.4em; /* Tamaño de fuente ligeramente más pequeño */
                padding: 18px 20px;
                border-top-left-radius: 0;
                border-top-right-radius: 0;
            }

            .chat-box {
                padding: 15px; /* Menos padding */
                gap: 10px; /* Menos espacio entre mensajes */
            }

            .message {
                padding: 10px 15px; /* Más pequeño */
                font-size: 0.95em; /* Texto ligeramente más pequeño */
                max-width: 90%; /* Ocupa más ancho en móvil */
            }

            .input-container {
                padding: 10px 15px; /* Menos padding */
                gap: 8px; /* Menos espacio entre input y botón */
            }

            .input-container input {
                padding: 12px 18px; /* Menos padding */
                font-size: 1em;
            }

            .input-container button {
                padding: 12px 20px; /* Menos padding */
                font-size: 1em;
            }

            .whatsapp-button {
                padding: 10px 20px;
                font-size: 0.95em;
                margin-top: 10px;
            }
        }

        /* Ajustes adicionales para pantallas muy pequeñas (ej. iPhone 5/SE) */
        @media (max-width: 360px) {
            .chat-header {
                font-size: 1.3em;
                padding: 15px;
            }
            .chat-box {
                padding: 10px;
            }
            .message {
                font-size: 0.9em;
                padding: 8px 12px;
            }
            .input-container input,
            .input-container button {
                font-size: 0.9em;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            Asistente Virtual Llutid+
        </div>
        <div class="chat-box" id="chat-box">
            </div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Escribe tu mensaje...">
            <button id="send-button">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // ** Datos de ejemplo para usuarios (en un caso real, vendrían de una DB) **
        const usersDB = [
            { fullName: 'JUAN PEREZ GOMEZ', phoneNumber: '3101234567' },
            { fullName: 'MARIA LOPEZ GARCIA', phoneNumber: '3119876543' },
            { fullName: 'CARLOS RODRIGUEZ SANCHEZ', phoneNumber: '3125551234' }
        ];

        let conversationState = 'awaiting_greeting'; // Nuevo estado inicial, esperando un saludo
        let currentUser = null; // Guardar el usuario que se está verificando
        let currentRequestType = ''; // 'password_change', 'email_change', 'login_issue', 'new_account_request', 'support_feedback'
        let generatedCode = ''; // Almacena el código de verificación generado

        // Para el flujo de registro de Llutid+
        let newAccountData = {
            fullName: '',
            email: '',
            phoneNumber: ''
        };

        // Para el flujo de soporte y quejas
        let userFeedback = '';

        // --- Configuración de Información de Contacto de Llutid ---
        const LLUTID_WHATSAPP_PHONE = '+573181087834'; // Número de WhatsApp para contacto con asesor
        const LLUTID_SUPPORT_PHONE = '+573181087834'; // Línea telefónica de Llutid
        const LLUTID_SUPPORT_EMAIL = 'llutidoficial@gmail.com'; // Correo electrónico oficial de Llutid
        // --- URLs de ejemplo (reemplaza con las URLs reales de tu sitio web) ---
        const LLUTID_REGISTER_URL = 'https://www.llutid.com/registro';
        const LLUTID_ABOUT_URL = 'https://www.llutid.com/quienes-somos';
        const LLUTID_PLANS_URL = 'https://www.llutid.com/planes';
        const LLUTID_HELP_URL = 'https://www.llutid.com/ayuda';

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Función para añadir mensajes al chat
        function appendMessage(text, sender, className = '') {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            if (className) {
                messageDiv.classList.add(className);
            }
            // Usa innerHTML si el texto contiene etiquetas HTML (como listas, negritas, enlaces)
            if (sender === 'bot' && (text.includes('<ul>') || text.includes('<a href=') || text.includes('<p>') || text.includes('<strong>') || text.includes('<div>'))) { // Añadido <div> para elementos como el botón de WhatsApp
                messageDiv.innerHTML = text;
            } else {
                messageDiv.textContent = text;
            }
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll al final
        }

        // Función para mostrar el indicador de "escribiendo..."
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('message', 'system');
            typingDiv.id = 'typing-indicator';
            typingDiv.textContent = 'El asistente está escribiendo...';
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll
        }

        // Función para remover el indicador de "escribiendo..."
        function removeTypingIndicator() {
            const typingDiv = document.getElementById('typing-indicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        // Genera un código aleatorio con el formato LNNNNN53
        function generateRandomCode() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const randomChar = characters.charAt(Math.floor(Math.random() * characters.length));
            let randomDigits = '';
            for (let i = 0; i < 5; i++) { // 5 dígitos aleatorios
                randomDigits += Math.floor(Math.random() * 10);
            }
            return `${randomChar}${randomDigits}53`;
        }

        // Muestra el mensaje de bienvenida inicial
        function displayInitialWelcomeMessage() {
            appendMessage('¡Hola! 👋 Soy tu asistente virtual de Llutid+.', 'bot');
            appendMessage('Estoy aquí para ayudarte con cualquier consulta o problema que tengas. Escribe **"Hola"** o un saludo para comenzar.', 'bot');
        }

        // Muestra el menú de opciones (principal)
        async function showMenu(fromReturn = false) { // fromReturn para controlar el mensaje inicial
            if (!fromReturn) { // Solo muestra este mensaje si no viene de una opción de "volver"
                appendMessage('¡Excelente! ¿En qué puedo ayudarte hoy? ✨', 'bot');
                await new Promise(resolve => setTimeout(resolve, 800));
            }

            const menuHtml = `
                <p>Por favor, selecciona una de las siguientes opciones ingresando el **número** correspondiente:</p>
                <ul>
                    <li><strong>1.</strong> Problemas con mi cuenta o al iniciar sesión.</li>
                    <li><strong>2.</strong> Quiero ser parte de la familia Llutid+ / Obtener una cuenta.</li>
                    <li><strong>3.</strong> ¿Qué es Llutid+?</li>
                    <li><strong>4.</strong> Preguntas frecuentes.</li>
                    <li><strong>5.</strong> Soporte de problemas, quejas o sugerencias.</li>
                    <li><strong>6.</strong> Hablar con un asesor.</li>
                    <li><strong>7.</strong> Cancelación de cuenta.</li>
                </ul>
                <p>Si en algún momento quieres volver a este menú, simplemente escribe **"Menú"** o el **número 0**.</p>
            `;
            appendMessage(menuHtml, 'bot');
            conversationState = 'initial_menu'; // Establece el estado para esperar la selección del menú
        }

        // Función principal para manejar los mensajes del usuario
        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            appendMessage(message, 'user');
            userInput.value = '';
            showTypingIndicator(); // Mostrar indicador de "escribiendo"

            await new Promise(resolve => setTimeout(resolve, 800)); // Simular tiempo de procesamiento

            let botResponse = '';
            const normalizedMessage = message.toLowerCase();

            // Manejo global de "Menú" o "0" (para volver al menú principal)
            if (normalizedMessage === 'menu' || normalizedMessage === '0') {
                removeTypingIndicator();
                await showMenu(true); // Pasar true para evitar el mensaje de "Excelente..." repetitivo
                return;
            }

            switch (conversationState) {
                case 'awaiting_greeting':
                    if (normalizedMessage.includes('hola') || normalizedMessage.includes('buenos dias') || normalizedMessage.includes('buenas tardes') || normalizedMessage.includes('buenas noches') || normalizedMessage.includes('que tal')) {
                        removeTypingIndicator();
                        await showMenu();
                        return;
                    } else {
                        botResponse = 'Para iniciar nuestra conversación, por favor, escribe **"Hola"** o un saludo. ¡Estoy aquí para asistirte con gusto! 😊';
                    }
                    break;
                case 'initial_menu':
                    botResponse = await handleInitialMenuSelection(message);
                    break;
                case 'sub_menu_1': // Problemas con la cuenta o login
                    botResponse = await handleSubMenu1Selection(message);
                    break;
                case 'awaiting_full_name':
                    botResponse = await handleFullName(message);
                    break;
                case 'awaiting_phone_number':
                    botResponse = await handlePhoneNumber(message);
                    break;
                case 'awaiting_security_code':
                    botResponse = await handleSecurityCode(message);
                    break;
                case 'new_account_name':
                    botResponse = await handleNewAccountName(message);
                    break;
                case 'new_account_email':
                    botResponse = await handleNewAccountEmail(message);
                    break;
                case 'new_account_phone':
                    botResponse = await handleNewAccountPhone(message);
                    break;
                case 'faq_section_expanded':
                    botResponse = await handleFAQSectionExpanded(message);
                    break;
                case 'awaiting_user_feedback':
                    botResponse = await handleUserFeedbackInput(message);
                    break;
                case 'confirm_send_feedback':
                    botResponse = await handleConfirmSendFeedback(message);
                    break;
                default:
                    botResponse = 'Lo siento, no pude entender tu solicitud en este momento. Por favor, selecciona una opción del menú principal escribiendo el número correspondiente, o escribe **"Menú"** o el **"0"** para ver todas las opciones disponibles. 🤔';
                    break;
            }
            removeTypingIndicator();
            if (botResponse) {
                appendMessage(botResponse, 'bot');
            }
        }

        async function handleInitialMenuSelection(userMessage) {
            const normalizedMessage = userMessage.trim();
            let response = '';

            switch (normalizedMessage) {
                case '1':
                    conversationState = 'sub_menu_1';
                    response = `
                        <p>Has seleccionado la opción **"Problemas con mi cuenta o al iniciar sesión"**.</p>
                        <p>Para poder ayudarte de la mejor manera, por favor, elige la opción que mejor describe tu situación ingresando el **número** correspondiente:</p>
                        <ul>
                            <li><strong>1.</strong> Se me olvidó la contraseña / PIN.</li>
                            <li><strong>2.</strong> Quiero cambiar mi correo electrónico.</li>
                            <li><strong>3.</strong> No puedo ingresar a mi cuenta / No funciona el login.</li>
                            <li><strong>4.</strong> Otro problema con mi cuenta.</li>
                        </ul>
                        <p>Recuerda que en cualquier momento puedes escribir **"0"** para volver al menú principal. 🔙</p>
                    `;
                    break;
                case '2':
                    currentRequestType = 'new_account_request';
                    conversationState = 'new_account_name';
                    newAccountData = { fullName: '', email: '', phoneNumber: '' }; // Reiniciar datos
                    response = '¡Excelente decisión! 🎉 Para ayudarte a iniciar tu proceso de registro en Llutid+, por favor, ingresa tu **NOMBRE COMPLETO EN MAYÚSCULAS, SIN PUNTOS, COMAS NI ACENTOS**. Por ejemplo: **JUAN PEREZ GOMEZ**. Puedes escribir **0** para volver al menú anterior si lo necesitas.';
                    break;
                case '3':
                    response = `
                        <p>¡Llutid+ es tu destino definitivo para el entretenimiento digital! 🎬🎮</p>
                        <p>Somos una **plataforma de streaming** que te ofrece una **amplia y emocionante variedad de películas, series y transmisiones en vivo**, desde los últimos estrenos hasta tus clásicos favoritos. Nuestro objetivo es brindarte una experiencia inigualable con **beneficios muy económicos**, ¡contamos con planes desde solo **2.500 COP** para una sola persona, y paquetes familiares muy convenientes!</p>
                        <p>Nos enorgullece ser una plataforma **intuitiva, fácil de usar y altamente profesional**, siempre manteniéndote informado de todas las novedades y actualizaciones. Contamos con un **servicio de soporte dedicado y siempre disponible** para resolver cualquier duda y asegurarnos de que disfrutes de tu contenido sin interrupciones.</p>
                        <p>¡Sumérgete en un mundo de entretenimiento sin límites con Llutid+ y descubre la diversión que te espera! ✨</p>
                        <p>Si deseas explorar más, puedes visitar nuestra sección "<a href="${LLUTID_ABOUT_URL}" target="_blank">Quiénes Somos</a>" en nuestra página web, o escribe **"Menú"** o **"0"** para volver a las opciones principales.</p>
                    `;
                    break;
                case '4':
                    response = `
                        <p>Has seleccionado **"Preguntas Frecuentes"** (FAQ). Aquí tienes algunas de las consultas más comunes que recibimos de nuestros usuarios: 🤔</p>
                        <ul>
                            <li><strong>1.</strong> ¿Qué tipo de contenido puedo encontrar en Llutid+?</li>
                            <li><strong>2.</strong> ¿Cuáles son los planes de suscripción y precios disponibles?</li>
                            <li><strong>3.</strong> ¿Cómo puedo contactar al equipo de soporte técnico de Llutid+?</li>
                            <li><strong>4.</strong> ¿Cuál es el horario de atención al cliente?</li>
                            <li><strong>5.</strong> ¿Llutid+ ofrece pruebas gratuitas o descuentos especiales?</li>
                        </ul>
                        <p>Por favor, escribe el **número de la pregunta** que te interesa para obtener una respuesta detallada, o el **0** para volver al menú principal. ↩️</p>
                    `;
                    conversationState = 'faq_section_expanded';
                    break;
                case '5':
                    currentRequestType = 'support_feedback';
                    conversationState = 'awaiting_user_feedback';
                    response = `
                        <p>En Llutid+, tu opinión es muy importante para nosotros y nos ayuda a mejorar. ¡Gracias por querer compartirla! 🙏</p>
                        <p>Por favor, **describe tu problema, queja o sugerencia en un solo mensaje de texto**. Sé lo más claro y específico posible para que podamos entenderte perfectamente. Cuando termines de escribir, simplemente envíalo.</p>
                        <p>Si cambias de opinión, puedes escribir **0** para volver al menú anterior.</p>
                    `;
                    break;
                case '6':
                    response = await getAdvisorAvailabilityMessage();
                    break;
                case '7':
                    response = `
                        <p>Comprendo tu solicitud de cancelación de cuenta. En Llutid+, la **seguridad y privacidad de tus datos** son nuestra prioridad máxima. Por esta razón, el proceso de cancelación de cuenta requiere una verificación directa y personalizada con nuestro equipo.</p>
